[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.12.0"
  # This committed file contains development examples and documented placeholders.
  # Keep secret scanning enabled for source code, functions, and generated build files.
  SECRETS_SCAN_OMIT_PATHS = ".env.example"
  # These values are public paths, identifiers, numeric settings, or local-only
  # configuration. They are intentionally present in source code and tests.
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,INTERNAL_FUNCTION_TOKEN,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REFRESH_TOKEN,GOOGLE_CALENDAR_ID,CALENDAR_APPOINTMENT_DURATION_MINUTES,CALENDAR_WORKER_MAX_ATTEMPTS"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["web-push"]

[functions."calendar-sync"]
  schedule = "* * * * *"

[functions."push-notification-background"]
  background = true

[[redirects]]
  from = "/api/appointments/:id/approve"
  to = "/.netlify/functions/appointment-action?id=:id&action=approve"
  status = 200
  force = true

[[redirects]]
  from = "/api/appointments/:id/reject"
  to = "/.netlify/functions/appointment-action?id=:id&action=reject"
  status = 200
  force = true

[[redirects]]
  from = "/api/appointments/:id/ics"
  to = "/.netlify/functions/appointment-ics?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/appointments"
  to = "/.netlify/functions/appointments"
  status = 200
  force = true

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200
  force = true

[[redirects]]
  from = "/api/push/*"
  to = "/.netlify/functions/push"
  status = 200
  force = true

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
